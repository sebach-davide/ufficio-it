<html lang="it">
<head>
<meta charset="utf-8">

<title>Ufficio IT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{
  --bg:#1c1e2e;--bg2:#232539;--panel:rgba(40,43,64,.86);--panel-solid:#282b40;--card:rgba(52,56,82,.7);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --ink:#ece8dc;--ink2:#c9c6bd;--mute:#9093aa;--mute2:#6f7290;
  --gold:#e3b341;--gold-bg:rgba(227,179,65,.14);--green:#5fd08a;--green-bg:rgba(95,208,138,.13);
  --red:#ff7b7b;--red-bg:rgba(255,123,123,.13);--blue:#7aa2ff;--blue-bg:rgba(122,162,255,.13);
  --mono:'IBM Plex Mono',ui-monospace,monospace;--serif:'DM Serif Display',Georgia,serif;--sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
.app{display:grid;grid-template-rows:52px 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(#20223399,#1c1e2e);z-index:5;min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.6px}
.brand i{font:500 10px var(--mono);color:var(--mute);font-style:normal}
.brand{align-items:center}.sblogo{height:19px;width:auto;display:block}.bsep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.sep{width:1px;height:20px;background:var(--line2)}
.conn{display:flex;align-items:center;gap:6px;font:500 10px var(--mono);letter-spacing:1px;color:var(--mute);text-transform:uppercase;min-width:0;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:7px;background:var(--card);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.bell{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;line-height:1;filter:grayscale(1);opacity:.55;position:relative}.bell.on{filter:none;opacity:1;border-color:rgba(227,179,65,.45);background:var(--gold-bg)}.bell:hover{opacity:1}
#syncChip{font:600 10.5px var(--mono);letter-spacing:.8px;font-variant-numeric:tabular-nums;min-width:196px;justify-content:center;cursor:default}
.tiles{display:flex;gap:5px}
.tile{position:relative;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;background:#e9e6dc;border:1px solid rgba(0,0,0,.2);color:#22243a;font:600 9.5px var(--mono);letter-spacing:.6px}
.tile img{width:15px;height:15px;display:block}
.tile .ic{width:15px;height:15px;display:grid;place-items:center}
.tile .st{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;border:2px solid var(--bg);background:var(--mute2)}
.tile .st.on{background:var(--green)}.tile .st.off{background:var(--red)}.tile .st.warn{background:var(--gold)}
.tile.dim{opacity:.55}
@media (max-width:1500px){.tile .tl{display:none}.tile{padding:0 6px}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute2);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.warn{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.grow{flex:1}
.hright{display:flex;align-items:center;gap:12px;white-space:nowrap}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font:600 10px var(--mono);letter-spacing:1px;color:var(--mute)}
.toggle .sw{position:relative;width:46px;height:28px;border-radius:14px;background:#4a4d66;transition:background .25s}
.toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.3,.7,.4,1.3)}
.toggle.on .sw{background:#34c759}
.toggle.on .sw::after{transform:translateX(18px)}
.toggle .lbl b{color:var(--ink)}
.kill{padding:7px 11px;border-radius:9px;border:1px solid rgba(255,123,123,.4);background:var(--red-bg);color:var(--red);font:600 11px var(--mono);letter-spacing:.8px;cursor:pointer}
.kill.paused{border-color:rgba(95,208,138,.45);background:var(--green-bg);color:var(--green)}
.mkts{display:flex;gap:6px;white-space:nowrap}
.mk{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line);font:600 10px var(--mono);letter-spacing:.6px;color:var(--ink2)}
.mk small{font-weight:500;color:var(--mute);letter-spacing:.3px}
.mk.open{border-color:rgba(95,208,138,.35)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mn{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.mrow .mn small{font:500 10px var(--mono);color:var(--mute)}
.mrow .ms{font:500 10.5px var(--mono);color:var(--mute);margin-top:2px}
.mrow.off .mn{color:var(--mute)}
.mrow .toggle{background:none;border:0;padding:0}
.mrow .toggle .sw{width:38px;height:22px}
.mrow .toggle .sw::after{width:16px;height:16px}
.mrow .toggle.on .sw::after{transform:translateX(16px)}
.clock{font:500 11px var(--mono);color:var(--gold);padding:5px 8px;border-radius:7px;background:var(--gold-bg)}
main{position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;transition:filter .12s}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
#wires path{fill:none;stroke-width:1.6;stroke-linecap:round}
#wires circle{stroke:none}
.panel{position:absolute;top:14px;bottom:14px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;z-index:3;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#left{left:14px;width:318px}
#right{right:14px;width:352px}
.pscroll{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.pscroll::-webkit-scrollbar{width:6px}.pscroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.cap{font:600 10px var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
.big{font-family:var(--serif);font-size:30px;line-height:1.05;margin:6px 0 2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font:500 11px var(--mono);color:var(--mute);margin-top:8px}
.kv b{color:var(--ink);font-weight:500;text-align:right}
.kv.kv2{grid-template-columns:auto 1fr}.kv.kv2 span{white-space:nowrap}
.pos{color:var(--green)!important}.neg{color:var(--red)!important}
.ddn{display:flex;gap:10px;font:600 10px var(--mono);color:var(--mute);letter-spacing:.8px;margin-top:8px}
.ddn b{color:var(--ink);font-size:12px}
.feed{display:flex;flex-direction:column;gap:7px}
.ev{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:start;font-size:12px;line-height:1.35;color:var(--ink2)}
.ev .dot{margin-top:5px}
.ev time{font:500 10px var(--mono);color:var(--mute2);white-space:nowrap}
.ev.allarme{color:#ffc0c0}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;cursor:pointer;font:600 10px var(--mono);letter-spacing:1.2px;color:var(--mute);text-transform:uppercase}
.back:hover{color:var(--ink)}
.rhead{display:flex;align-items:center;gap:10px}
.rhead h2{margin:0;font-family:var(--serif);font-weight:400;font-size:26px}
.swatch{width:12px;height:12px;border-radius:4px;flex:none}
.lead{border-left:3px solid var(--gold)}
.lead h3{margin:4px 0;font-family:var(--serif);font-weight:400;font-size:20px;display:flex;gap:6px;align-items:center}
.lead p{margin:4px 0 0;color:var(--ink2);line-height:1.45;font-size:12.5px}
.ag{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.ag:first-of-type{border-top:0}
.ag .n{font-weight:600;font-size:12.5px}
.ag .r{color:var(--mute);font-size:11.5px;margin-top:1px;line-height:1.35}
.ag .s{font:600 9.5px var(--mono);letter-spacing:.8px;padding:3px 6px;border-radius:6px;background:var(--line);color:var(--mute)}
.s.working{background:var(--blue-bg);color:var(--blue)}.s.waiting{background:var(--gold-bg);color:var(--gold)}.s.done{background:var(--green-bg);color:var(--green)}.s.error{background:var(--red-bg);color:var(--red)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.msg{padding:8px 10px;border-radius:11px;font-size:12.5px;line-height:1.45;max-width:92%;white-space:pre-wrap;word-wrap:break-word}
.msg.d{align-self:flex-end;background:#3d4266;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#2f3350;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg time{display:block;font:500 9.5px var(--mono);color:var(--mute2);margin-top:3px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.q{padding:6px 9px;border-radius:9px;background:transparent;border:1px solid var(--line2);font-size:11.5px;color:var(--ink2);cursor:pointer}
.q:hover{border-color:var(--gold);color:var(--ink)}
.inrow{display:flex;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.inrow input,.inrow select,.field{flex:1;min-width:0;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:#1f2133;color:var(--ink);font-size:13px;outline:none;font-family:inherit}
.inrow input:focus,.field:focus{border-color:var(--gold)}
.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:#363a58;color:var(--ink);font:600 11px var(--mono);letter-spacing:.6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1c1e2e}
.btn.green{background:var(--green-bg);border-color:rgba(95,208,138,.4);color:var(--green)}
.btn.red{background:var(--red-bg);border-color:rgba(255,123,123,.35);color:var(--red)}
.btn.sm{padding:6px 9px;font-size:10px}
.note{font-size:11px;color:var(--mute);line-height:1.4}
.tabs{display:flex;gap:4px;padding:10px 12px 0}
.tab{flex:1;padding:8px 2px;border-radius:9px;border:1px solid transparent;background:none;font:600 9.5px var(--mono);letter-spacing:.5px;color:var(--mute);cursor:pointer;text-transform:uppercase;position:relative}
.tab.on{background:var(--card);border-color:var(--line);color:var(--ink)}
.tab .badge{position:absolute;top:-6px;right:-2px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--gold);color:#1c1e2e;font-size:9px;line-height:15px}
.composer{padding:10px 12px;border-bottom:1px solid var(--line)}
.composer .who{font:600 10px var(--mono);letter-spacing:1px;color:var(--mute);margin-bottom:6px;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.composer .row{display:flex;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:none;font:600 10px var(--mono);color:var(--mute);cursor:pointer;letter-spacing:.4px}
.fchip.on{background:#ece8dc;color:#1c1e2e;border-color:#ece8dc}
.fchip.w{border-color:rgba(227,179,65,.45);color:var(--gold)}
.fchip.w.on{background:var(--gold);color:#1c1e2e}
.titem{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px;border-radius:11px;background:var(--card);border:1px solid var(--line);animation:slidein .45s ease}
.titem.wait{border-color:rgba(227,179,65,.4);background:rgba(227,179,65,.06)}
.pill{font:600 9.5px var(--mono);letter-spacing:.5px;padding:4px 7px;border-radius:7px;background:var(--line);color:var(--mute);height:fit-content;min-width:44px;text-align:center}
.pill.done,.pill.eseguito{background:var(--green-bg);color:var(--green)}
.pill.in_progress,.pill.inviato,.pill.approvato{background:var(--blue-bg);color:var(--blue)}
.pill.waiting,.pill.proposto{background:var(--gold-bg);color:var(--gold)}
.pill.sospesa{background:rgba(154,168,74,.16);color:#c3d06a}
.pill.rifiutato,.pill.errore,.pill.respinto,.pill.annullato,.pill.scaduto{background:var(--red-bg);color:var(--red)}
.titem .t{font-weight:600;font-size:12.5px;line-height:1.35}
.titem.solo{grid-template-columns:1fr}.titem.solo .t{word-break:break-word}.titem.solo .acts{margin-top:8px}
.titem .m{font:500 10px var(--mono);color:var(--mute);margin-top:4px;letter-spacing:.3px;text-transform:uppercase}
.titem .x{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.4}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .6s}
.cprog{display:flex;align-items:center;gap:8px;margin-top:8px}.cprog .bar{flex:1;margin:0;height:4px}.cprog b{font:600 10px var(--mono);color:var(--blue);min-width:30px;text-align:right}
.bar.live i{background:linear-gradient(90deg,var(--blue) 0%,#b9ccff 50%,var(--blue) 100%);background-size:200% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:0 0}}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{padding:22px 10px;text-align:center;color:var(--mute);font-size:12px;line-height:1.5}
.sect{font:600 10px var(--mono);letter-spacing:1.3px;color:var(--mute);text-transform:uppercase;margin:4px 2px 0;display:flex;justify-content:space-between}
.tk{display:inline-block;padding:3px 7px;border-radius:6px;background:#1f2133;border:1px solid var(--line);font:600 10.5px var(--mono);margin:2px 4px 0 0}
.dcard{position:absolute;pointer-events:auto;cursor:pointer;width:166px;padding:9px 10px;border-radius:12px;background:rgba(40,43,64,.92);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translate(-50%,calc(-100% + 14px));transition:box-shadow .3s,border-color .3s,opacity .3s;font-family:var(--mono)}
.dcard .h{display:flex;align-items:center;gap:6px;font:600 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase}
.dcard .h .live{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--red);opacity:.0}
.dcard.active .h .live{opacity:1;animation:blink 1.2s infinite}
.dcard .n{font-family:var(--serif);font-size:25px;margin:4px 0 0;display:flex;align-items:baseline;gap:6px}
.dcard .n small{font:600 9.5px var(--mono);letter-spacing:1.2px;color:var(--mute)}
.dcard .mt{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:9.5px;letter-spacing:.6px;color:var(--mute);text-transform:uppercase;margin-top:5px}
.dcard .mt b{color:var(--ink);font-weight:600}
.dcard .mt b.flash{animation:flash 1.4s ease}
.dcard .ddn{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:9.5px;justify-content:space-between}
.dcard .appr{margin-top:7px;padding:5px;border-radius:7px;background:var(--gold-bg);border:1px solid rgba(227,179,65,.55);color:var(--gold);font-size:9.5px;font-weight:600;letter-spacing:.8px;text-align:center;text-transform:uppercase}
.dcard.hot,.dcard:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 28px color-mix(in srgb,var(--c) 55%,transparent),0 10px 30px rgba(0,0,0,.35)}
.dcard.dim{opacity:.35}
.dcard .mini{display:none;font-size:9.5px;letter-spacing:.5px;color:var(--mute);margin-top:4px;text-transform:uppercase;white-space:nowrap}
.dcard.compact{width:auto;padding:6px 9px;border-radius:10px}
.dcard.compact .full{display:none}
.dcard.compact .mini{display:block}
.dcard.compact .h .live{margin-left:6px}
.dlbl{position:absolute;transform:translate(-50%,-100%);padding:3px 7px;border-radius:7px;background:rgba(36,38,56,.92);border:1px solid var(--line2);font:600 9px var(--mono);letter-spacing:.9px;color:var(--ink);text-transform:uppercase;white-space:nowrap;transition:opacity .25s}
.dlbl.lead::before{content:'★ ';color:var(--gold)}
.dlbl.hide{opacity:0}
.blbl{position:absolute;transform:translate(-50%,-50%);padding:5px 10px;border-radius:9px;background:rgba(36,38,56,.92);border:1px solid var(--line2);font:600 10px var(--mono);letter-spacing:1.2px;color:var(--ink);text-transform:uppercase;white-space:nowrap;pointer-events:auto;cursor:pointer}
.blbl::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#cfd3ff;margin-right:6px;box-shadow:0 0 8px #cfd3ff}
.srclbl{position:absolute;transform:translate(-50%,-100%);font:600 9px var(--mono);letter-spacing:1.3px;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.zoom{position:absolute;right:380px;bottom:22px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--panel-solid);font-size:16px;cursor:pointer;display:grid;place-items:center}
.zoom button:hover{border-color:var(--gold)}
.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;padding:9px 14px;border-radius:11px;font-size:12.5px;font-weight:500;display:none;max-width:min(520px,calc(100% - 32px));text-align:center}
.banner.show{display:block}
.banner.red{background:#4a2630;border:1px solid rgba(255,123,123,.5);color:#ffd0d0}
.banner.gold{background:#463a1e;border:1px solid rgba(227,179,65,.55);color:#ffe7a8}
.modal{position:fixed;inset:0;background:rgba(10,11,20,.6);display:none;place-items:center;z-index:20;padding:16px}
.modal.show{display:grid}
.modal .box{width:min(380px,100%);background:var(--panel-solid);border:1px solid var(--line2);border-radius:16px;padding:20px}
.modal h4{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:22px}
.modal p{margin:0 0 16px;color:var(--ink2);line-height:1.5}
.modal .acts{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 14px;border-radius:11px;background:#2f3350;border:1px solid var(--line2);z-index:30;transition:.3s;font-size:12.5px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font:600 11px var(--mono);letter-spacing:1.5px;z-index:2}
.spark{width:100%;height:54px;display:block;margin-top:8px}
.legend{display:flex;gap:10px;font:500 10px var(--mono);color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}
.kill.busy{border-color:rgba(122,162,255,.45);background:var(--blue-bg);color:var(--blue)}
.titem.clic{cursor:pointer}.titem.clic:hover{border-color:var(--line2)}
.tk.rifiutato{color:var(--red);border-color:rgba(255,123,123,.35)}.tk.waiting{color:var(--gold);border-color:rgba(227,179,65,.4)}
.hidden{display:none!important}
.emodal{position:fixed;inset:0;background:rgba(10,11,20,.66);display:none;z-index:15;padding:24px}
.emodal.show{display:flex;align-items:center;justify-content:center}
.ebox{width:min(1180px,100%);height:min(880px,100%);background:var(--panel-solid);border:1px solid var(--line2);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.ehead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ehead h4{margin:2px 0 0;font-family:var(--serif);font-weight:400;font-size:24px}
.ehead .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.egrid{flex:1;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:0}
.ecol{overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:11px;min-height:0}
.ecol+.ecol{border-left:1px solid var(--line)}
.ofield{display:grid;gap:3px;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.ofield>span{font:600 9.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.ofield>div{white-space:pre-wrap;word-wrap:break-word}
.erow{display:flex;gap:8px;flex-wrap:wrap}
.ttab{width:100%;border-collapse:collapse;font-size:12px}.ttab th{font:600 9.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--mute);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.ttab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.ttab td.n{text-align:right;font-family:var(--mono);white-space:nowrap}.ttab .cod{font-family:var(--mono);color:var(--ink2);white-space:nowrap}
.es{font:600 9.5px var(--mono);letter-spacing:.8px;padding:2px 6px;border-radius:5px;white-space:nowrap}.es.in_tempo{background:var(--green-bg);color:var(--green)}.es.al_limite{background:var(--gold-bg);color:var(--gold)}.es.in_ritardo{background:var(--red-bg);color:var(--red)}.es.sospesa{background:var(--card);color:var(--mute)}
.soglie{display:grid;grid-template-columns:auto auto auto;justify-content:start;gap:6px 10px;align-items:center;font-size:12px}.soglie input{width:70px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#1f2133;color:var(--ink);font:12px var(--mono)}
.tsec{font:600 10px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:6px 0 2px}
.allg{display:flex;flex-wrap:wrap;gap:8px;white-space:normal!important}.allg img{height:84px;max-width:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);display:block}.allg .afile{color:var(--blue);text-decoration:none;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px}.allg small{color:var(--mute)}
.ef{display:flex;flex-direction:column;gap:4px;min-width:0}
.ef>span{font:600 9.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.ef input,.ef select,.ef textarea{padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:#1f2133;color:var(--ink);font:13px var(--sans);outline:none}
.ef input:focus,.ef textarea:focus,.ef select:focus{border-color:var(--gold)}
.ef input:disabled,.ef textarea:disabled,.ef select:disabled{opacity:.7}
.ef textarea{min-height:260px;resize:vertical;line-height:1.5;font-family:var(--mono);font-size:12.5px;flex:1}
.ef.grow1{flex:1}
.eacts{align-items:center}
@media (max-width:900px){.emodal{padding:0}.ebox{height:100%;border-radius:0;overflow:auto}.egrid{grid-template-columns:1fr}.ecol{overflow:visible}.ecol+.ecol{border-left:0;border-top:1px solid var(--line)}}
@keyframes blink{50%{opacity:.25}}
@keyframes flash{0%{color:var(--green);text-shadow:0 0 10px var(--green)}100%{}}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (max-width:1650px){.conn .chip.opt,.conn>span:first-child{display:none}}
@media (max-width:1380px){.mk small{display:none}}
@media (max-width:1180px){.mkts{display:none}#left{width:280px}#right{width:318px}.zoom{right:346px}.conn .chip.opt{display:none}}
@media (max-width:900px){
  .app{grid-template-rows:auto auto;height:auto;min-height:100dvh}
  header{flex-wrap:wrap;height:auto;padding:10px 16px calc(10px);gap:10px;position:sticky;top:0;background:#1c1e2ef2;backdrop-filter:blur(10px)}
  .brand i,.bsep,.sep,.conn{display:none}.sblogo{height:15px}
  .hright{width:100%;justify-content:space-between}
  main{overflow:visible;display:flex;flex-direction:column}
  #stagewrap{position:relative;height:56vh;min-height:340px}
  .panel{position:relative;top:auto;bottom:auto;left:auto;right:auto;width:auto;margin:12px 16px 0;max-height:none;backdrop-filter:none;background:var(--panel-solid)}
  #right{order:2}
  #left{order:3;margin-bottom:16px}
  #stagewrap{order:1}
  .pscroll{overflow:visible}
  .zoom{right:16px;bottom:12px}
  .dcard{width:140px;padding:8px}
  .dcard .mt,.dcard .ddn{display:none}
  .dcard.compact .mini{display:none}
  .dcard.compact{padding:4px 7px}
  .dcard .h{font-size:9px;letter-spacing:.8px}
  .dcard .n{font-size:20px}
  .banner{top:8px}
}
@media (min-width:901px){#stagewrap{position:absolute;inset:0}}
</style>
</head>

async function api(path, data) {

  if (s === 'working' && age > 45) s = 'idle';
  if (s === 'waiting' && S && !inAttesaDiDavide(a.reparto_id)) s = age > 15 ? 'idle' : 'done';
  if (s === 'done' && age > 15) s = 'idle';

    att = S.daRivedere > 0 ? `${S.daRivedere} da rivedere e inviare` : 'Niente da rivedere';

}
function repMetrics(id) {
  const m = S.metriche || {};

    case 'accettazione': return [['In coda', m.nuove], ['Arrivate 7gg', m.arrivate7]];
    case 'triage': return [['BUG', m.bug], ['CR', m.cr]];

function progressoStimato(t) {
  const reale = t.progresso || 0;
  const min = (Date.now() - parseTs(t.aggiornato || t.creato)) / 60000;
  const stima = Math.min(92, reale + (92 - reale) * (1 - Math.exp(-min / 6)));
  return Math.round(Math.max(reale, stima));
}
function repTasks(id) {

}

const bozze = {};
function conservaInput(fn) {
  return function (...args) {
    document.querySelectorAll('#left input[id], #left select[id], #left textarea[id], #right input[id], #right select[id], #right textarea[id]').forEach(el => { if (el.type !== 'password' && el.type !== 'file') bozze[el.id] = el.value; });

    const sel = focusId && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;
    const out = fn.apply(this, args);
    document.querySelectorAll('#left input[id], #left select[id], #left textarea[id], #right input[id], #right select[id], #right textarea[id]').forEach(el => { if (bozze[el.id] != null && el.type !== 'password' && el.type !== 'file' && el.value !== bozze[el.id]) el.value = bozze[el.id]; });

    return out;
  };
}

const LIB = {};
function script(src) {
  if (!LIB[src]) LIB[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Libreria non caricata')); document.head.appendChild(s); });
  return LIB[src];
}
async function estraiTesto(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') {
    await script('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    const out = [];
    for (let i = 1; i <= pdf.numPages; i++) { const c = await (await pdf.getPage(i)).getTextContent(); out.push(`--- pagina ${i} ---\n` + c.items.map(x => x.str + (x.hasEOL ? '\n' : ' ')).join('')); }
    return out.join('\n\n');
  }
  if (ext === 'docx') {
    await script('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()})).value;
  }
  if (ext === 'xlsx' || ext === 'xls') {
    await script('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
    return wb.SheetNames.map(n => `--- foglio ${n} ---\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n');
  }
  return await file.text();
}
async function caricaFile(files) {
  if (!files.length) return;
  for (const f of files) {
    toast('Leggo ' + f.name + '…');
    let testo;
    try { testo = (await estraiTesto(f)).replace(/\u0000/g, '').trim(); } catch (e) { toast(f.name + ': non riesco a leggerlo'); continue; }
    if (!testo) { toast(f.name + ': nessun testo trovato (forse è una scansione)'); continue; }
    const PEZZO = 800000, parti = Math.ceil(testo.length / PEZZO);
    const base = f.name.replace(/\.[^.]+$/, '');
    for (let i = 0; i < parti; i++) {
      await api('/api/brain', {tipo: 'documento', titolo: parti > 1 ? `${base} (parte ${i + 1} di ${parti})` : base, contenuto: testo.slice(i * PEZZO, (i + 1) * PEZZO), tag: (f.name.split('.').pop() || '').toLowerCase(), fonte: f.name, silenzioso: i > 0});
    }
    toast(`${f.name} nel Brain`);
  }
  $('#brFile').value = '';
  caricaBrain(true);
}
async function apriBrain(id) {
  let n = {tipo: 'nozione', titolo: '', contenuto: '', tag: ''};
  if (id) n = await api('/api/brain/' + id);
  $('#bxT').value = n.titolo || ''; $('#bxTag').value = n.tag || ''; $('#bxC').value = n.contenuto || '';
  $('#bxCap').textContent = id ? `${n.tipo} · ${n.fonte || ''}` : 'Nuova nozione';
  $('#bx').classList.add('show');
  $('#bxSave').onclick = async () => {
    const titolo = $('#bxT').value.trim(), contenuto = $('#bxC').value;

    if (id) await api(`/api/brain/${id}/aggiorna`, {titolo, contenuto, tag: $('#bxTag').value.trim()});
    else await api('/api/brain', {tipo: 'nozione', titolo, contenuto, tag: $('#bxTag').value.trim()});
    $('#bx').classList.remove('show'); toast('Salvato nel Brain'); caricaBrain(true);
  };
}

  rooms.forEach(rm => {
    const target = (hoverRoom === rm.id || rm.hoverCard) ? 1 : 0;
    rm.hover += (target - rm.hover) * Math.min(1, dt * 8);
    const s = selected === rm.id ? 1 : 0; rm.sel += (s - rm.sel) * Math.min(1, dt * 6);
    rm.topMat.emissive.set(rm.color);
    rm.topMat.emissiveIntensity = rm.hover * 0.35 + rm.sel * 0.18 + (rm.active ? 0.06 + 0.05 * Math.sin(T * 3) : 0);
    rm.card.classList.toggle('hot', rm.hover > 0.5 || selected === rm.id);
    rm.card.classList.toggle('dim', !!selected && selected !== rm.id && view.zoom > 1.6);
    const a1 = screenOf(rm.center.clone().setX(rm.center.x - rm.w / 2)), a2 = screenOf(rm.center.clone().setX(rm.center.x + rm.w / 2));
    const wide = Math.hypot(a2.x - a1.x, a2.y - a1.y);
    if (rm.big === undefined) rm.big = false;
    if (!rm.big && (wide > 240 || rm.hover > 0.6)) rm.big = true;
    else if (rm.big && wide < 220 && rm.hover < 0.2) rm.big = false;
    rm.card.classList.toggle('compact', !rm.big);
    const p = screenOf(rm.miniAnchor);
    rm.card.style.left = p.x + 'px'; rm.card.style.top = p.y + 'px';
    rm.card.style.zIndex = rm.hover > 0.5 ? 5 : 1;
    rm.card.style.display = p.vis && selected !== rm.id ? '' : 'none';
  });
  animaDecori(dt, T);
  agents3d.forEach(ag => {
    const {s} = S ? agentState(ag.a) : {s: 'idle'};
    ag.state = s;
    ag.phase += dt;
    const working = s === 'working';
    ag.arms.forEach((arm, i) => {
      const goal = working ? 0.95 + Math.sin(ag.phase * 18 + i * Math.PI) * 0.12 : s === 'waiting' ? 0.15 : 0.35 + Math.sin(ag.phase * 0.7 + i) * 0.03;
      arm.rotation.x += (goal - arm.rotation.x) * Math.min(1, dt * 10);
    });
    ag.head.position.y = 1.02 + (working ? Math.sin(ag.phase * 9) * 0.012 : Math.sin(ag.phase * 1.3) * 0.01);
    ag.head.rotation.y = s === 'waiting' ? Math.sin(ag.phase * 1.5) * 0.5 : Math.sin(ag.phase * 0.4) * 0.12;
    ag.person.rotation.y = s === 'idle' ? Math.sin(ag.phase * 0.3) * 0.25 : 0;
    let kind = null;
    if (s === 'waiting') kind = 'warn'; else if (s === 'error') kind = 'err'; else if (s === 'done') kind = 'done';
    else if (working && Math.sin(ag.phase * 0.55 + ag.g.position.x) > 0.82) kind = 'think';
    if (kind !== ag.iconKind) { ag.iconKind = kind; if (kind) { ag.icon.material.map = ICON[kind]; ag.icon.material.needsUpdate = true; } }
    ag.icon.visible = !!kind;
    if (kind) { ag.icon.position.y = 3.0 + Math.sin(T * 3 + ag.phase) * 0.12; const sc = kind === 'warn' ? 1.0 + Math.sin(T * 5) * 0.08 : 0.85; ag.icon.scale.set(sc, sc, 1); }
    if (drawMon) drawMonitor(ag.mon, s, ag.room.color, T);
    const wp = new THREE.Vector3(); ag.anchor.getWorldPosition(wp);
    const p = screenOf(wp);
    ag.lbl.style.left = p.x + 'px'; ag.lbl.style.top = p.y + 'px';
    ag.lbl.classList.toggle('hide', !showLabels || !p.vis || (!!selected && ag.room.id !== selected));
  });
  if (brain) {
    const attivi = S ? Math.min(brain.nodes.length, 8 + ((S.brain.documento || 0) + (S.brain.nozione || 0)) * 3 + (S.metriche.lezioni || 0) * 2) : brain.nodes.length;
    brain.nodes.forEach((n, i) => { if (i >= attivi) { n.scale.setScalar(0.55); n.material.color.setHSL(0.65, 0.12, 0.32); return; } const k = 0.5 + 0.5 * Math.sin(T * 2 + i * 1.7); n.scale.setScalar(0.8 + k * 0.6); n.material.color.setHSL(0.65, 0.6, 0.75 + k * 0.2); });
    brain.net.material.opacity = 0.25 + 0.15 * Math.sin(T * 1.4);
    brain.group.rotation.y += dt * 0.05;
    const p = screenOf(brain.anchor); brain.lbl.style.left = p.x + 'px'; brain.lbl.style.top = p.y + 'px';
    brain.lbl.textContent = `The Brain · ${S ? S.metriche.lezioni || 0 : 0} lezioni · ${S ? (S.brain.documento || 0) + (S.brain.nozione || 0) : 0} documenti e nozioni`;
  }
  flows.forEach(f => {
    const id = f.kind.startsWith('src:') ? f.kind.slice(4) : f.kind;
    const rm = rooms.get(id), hot = rm && rm.active;
    f.t = (f.t + dt * (hot ? 0.45 : 0.08)) % 1;
    f.line.material.opacity = hot ? 0.75 : 0.28;
    f.dots.forEach(d => { const u = (f.t + d.o) % 1; d.d.position.copy(f.curve.getPoint(u)); d.d.visible = hot || d.o === 0; d.d.material.opacity = hot ? 1 : 0.55; });
  });
  scene.children.forEach(c => { if (c.userData.lbl) { const p = screenOf(c.position.clone().setY(2)); c.userData.lbl.style.left = p.x + 'px'; c.userData.lbl.style.top = p.y + 'px'; } });
  updateWires(dt);
  renderer.render(scene, camera);
}

let refreshing = false;
async function refresh() {
  if (refreshing) return; refreshing = true;
  try {
    S = await api('/api/stato');
    buildScene();
    aggiornaDecori();
    renderHeader(); updateCards();
    renderLeft();
    renderRight();
  } catch (e) { console.error(e); }
  finally { refreshing = false; }
}
renderLeft = conservaInput(renderLeft);
renderRight = conservaInput(renderRight);
resize();
requestAnimationFrame(animate);
refresh().then(() => { if (location.search) apriDaUrl(location.href); });
initNotif();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
setInterval(() => { if (selected && !document.hidden) loadChat(selected); }, 12000);
addEventListener('resize', () => { if (!selected) fit(false); });
</script>
</body>
